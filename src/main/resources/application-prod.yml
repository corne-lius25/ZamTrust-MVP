spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

server:
  port: 8080
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.zamtrust: INFO
    org.springframework.web: WARN

zamtrust:
  cors:
    allowed-origins: "${ZAMTRUST_CORS_ORIGINS:https://*.vercel.app}"
  jwt:
    secret: ${ZAMTRUST_JWT_SECRET}
    expiration-ms: 3600000
  storage:
    documents-dir: ${ZAMTRUST_STORAGE_DOCUMENTS_DIR:/app/storage/documents}
    keys-dir: ${ZAMTRUST_STORAGE_KEYS_DIR:/app/storage/keys}
  base-url: ${ZAMTRUST_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
