spring:
  application:
    name: zamtrust
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: 8080

zamtrust:
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5174"
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-very-long-random-secret-at-least-64-chars-xxxxxxxxxxxxxxxx}
    expiration-ms: 3600000
  storage:
    documents-dir: ./storage/documents
    keys-dir: ./storage/keys
  base-url: http://localhost:8080

logging:
  level:
    com.zamtrust: INFO
    org.springframework.security: WARN