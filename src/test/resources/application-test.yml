spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

zamtrust:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u
    expiration-ms: 3600000
  storage:
    documents-dir: ./target/test-storage/documents
    keys-dir: ./target/test-storage/keys
    signatures-dir: ./storage/signatures
  base-url: http://localhost:8080
  cors:
    allowed-origins: "http://localhost:5173"
